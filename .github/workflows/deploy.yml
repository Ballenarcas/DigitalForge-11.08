name: Build and Push to ACR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Push Docker image
        env:
          ACR_LOGIN: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USER: ${{ secrets.ACR_USERNAME }}
          ACR_PASS: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_PASS" ]; then
            echo "::error::El secreto ACR_PASSWORD esta vacio. Revisa que este creado como 'Repository secret' y no como 'Environment secret'."
            exit 1
          fi
          if [ -z "$ACR_USER" ]; then
            echo "::error::El secreto ACR_USERNAME esta vacio."
            exit 1
          fi
          
          echo "Iniciando sesion en docker ($ACR_LOGIN)..."
          echo "$ACR_PASS" | docker login "$ACR_LOGIN" -u "$ACR_USER" --password-stdin
          
          echo "Construyendo imagen..."
          docker build -t "$ACR_LOGIN/votify:latest" .
          
          echo "Subiendo imagen a ACR..."
          docker push "$ACR_LOGIN/votify:latest"
