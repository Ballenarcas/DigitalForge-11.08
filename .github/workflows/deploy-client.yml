name: Deploy Votify Client to GitHub Pages

on:
  push:
    branches: [ "main" ] # Se activa con cada push a la rama main

  # Permite ejecutarlo manualmente desde la pestaña de Actions en GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore Votify.Client/Votify.Client.csproj

      - name: Publish
        run: dotnet publish Votify.Client/Votify.Client.csproj -c Release -o release --nologo
      
      # Este paso es clave: crea un archivo 404.html que es una copia del index.html
      # GitHub Pages lo usará para manejar el enrutamiento del lado del cliente de Blazor.
      - name: Create 404.html for Blazor routing
        run: cp release/wwwroot/index.html release/wwwroot/404.html
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Sube el contenido de la carpeta wwwroot que es donde Blazor publica los archivos estáticos
          path: 'release/wwwroot'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
