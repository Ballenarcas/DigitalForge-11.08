<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votify</title>
<base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/ripple.css" />
    <link rel="icon" type="image/png" href="lib/favicon.png" />
    <link href="Votify.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // =========================================================
        // RIPPLE EFFECT - Visible y robusto
        // =========================================================
        document.addEventListener('DOMContentLoaded', function() {
            function addRipple(e) {
                var btn = e.target.closest('button, [class*="btn-"]');
                if (!btn || btn.disabled) return;

                var rect = btn.getBoundingClientRect();
                var clientX = e.clientX;
                var clientY = e.clientY;
                if (e.touches && e.touches.length) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                var size = Math.max(rect.width, rect.height) * 2.8;
                var x = clientX - rect.left - size / 2;
                var y = clientY - rect.top - size / 2;

                var ripple = document.createElement('span');
                ripple.className = 'ripple-span';
                ripple.style.width  = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left   = x + 'px';
                ripple.style.top    = y + 'px';

                btn.appendChild(ripple);

                // Forzar reflow para que la transicion funcione
                void ripple.offsetWidth;
                ripple.classList.add('ripple-animate');

                setTimeout(function() { ripple.remove(); }, 800);
            }

            document.addEventListener('pointerdown', addRipple, true);
        });
    </script>
</body>

</html>
