<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votify</title>
<base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/ripple.css" />
    <link rel="icon" type="image/png" href="lib/favicon.png" />
    <link href="Votify.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Ripple effect - 1 listener global, event delegation, max performance
        (function() {
            document.addEventListener('click', function(e) {
                var btn = e.target.closest('button, .btn, [class*="btn-"]');
                if (!btn || btn.disabled) return;

                var rect = btn.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height) * 2.2;
                var x = e.clientX - rect.left - size / 2;
                var y = e.clientY - rect.top - size / 2;

                var ripple = document.createElement('span');
                ripple.className = 'ripple-span ripple-animate';
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';

                btn.appendChild(ripple);
                setTimeout(function() { ripple.remove(); }, 700);
            });
        })();
    </script>
</body>

</html>
